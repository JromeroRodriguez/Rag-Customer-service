<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LinguaBridge Academy — Ask Lingua</title>
  <style>
    :root {
      --brand: #2f6fed;
      --bg: #f5f7fb;
      --text: #1f2430;
      --muted: #6b7280;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
      padding: 40px 16px;
    }
    .card {
      width: 100%;
      max-width: 560px;
      background: #fff;
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.06);
      padding: 32px;
    }
    h1 { font-size: 1.4rem; margin-bottom: 4px; }
    p.subtitle { color: var(--muted); margin-top: 0; margin-bottom: 24px; }
    textarea {
      width: 100%;
      min-height: 90px;
      border-radius: 10px;
      border: 1px solid #d9dde3;
      padding: 12px;
      font-size: 1rem;
      resize: vertical;
      font-family: inherit;
    }
    button {
      margin-top: 12px;
      background: var(--brand);
      color: #fff;
      border: none;
      padding: 10px 20px;
      border-radius: 999px;
      font-size: 0.95rem;
      cursor: pointer;
    }
    button:disabled { opacity: 0.6; cursor: default; }
    .answer {
      margin-top: 24px;
      padding: 16px;
      border-radius: 10px;
      background: #f0f4ff;
      white-space: pre-wrap;
      line-height: 1.5;
    }
    .answer.escalated { background: #fff4e5; }
    .badge {
      display: inline-block;
      font-size: 0.75rem;
      font-weight: 600;
      padding: 2px 8px;
      border-radius: 999px;
      margin-bottom: 8px;
    }
    .badge.ok { background: #dcfce7; color: #166534; }
    .badge.escalated { background: #fef3c7; color: #92400e; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Ask Lingua</h1>
    <p class="subtitle">LinguaBridge Academy's assistant — schedules, pricing, levels, enrollment and certifications.</p>

    <form id="query-form">
      <textarea id="question" placeholder="e.g. What are the English course prices for live online classes?" required></textarea>
      <br />
      <button type="submit" id="submit-btn">Ask</button>
    </form>

    <div id="result"></div>
  </div>

  <script>
    const form = document.getElementById("query-form");
    const resultEl = document.getElementById("result");
    const submitBtn = document.getElementById("submit-btn");

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const question = document.getElementById("question").value.trim();
      if (!question) return;

      submitBtn.disabled = true;
      submitBtn.textContent = "Thinking...";
      resultEl.innerHTML = "";

      try {
        const res = await fetch("/api/query", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ question }),
        });
        const data = await res.json();

        if (!res.ok) throw new Error(data.error || "Request failed");

        const badgeClass = data.escalated ? "escalated" : "ok";
        const badgeText = data.escalated ? "Escalated to human advisor" : "Answered automatically";

        resultEl.innerHTML = `
          <div class="answer ${badgeClass}">
            <span class="badge ${badgeClass}">${badgeText}</span>
            <div>${data.answer}</div>
          </div>
        `;
      } catch (err) {
        resultEl.innerHTML = `<div class="answer escalated">Sorry, something went wrong: ${err.message}</div>`;
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = "Ask";
      }
    });
  </script>
</body>
</html>
